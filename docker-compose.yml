services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dpdpa_owner
      POSTGRES_PASSWORD: owner_password
      POSTGRES_DB: dpdpa
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  pgdata:
